<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate | PROPERTY × TECH 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { navy: '#0A192F', magenta: '#D92662', purple: '#6D28D9' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-['Outfit']">

    <!-- Header -->
    <header class="bg-brand-navy text-white py-6 px-4 shadow-lg border-b-4 border-brand-magenta text-center">
        <h1 class="text-3xl font-extrabold tracking-widest mb-1">PROPERTY × TECH 2026</h1>
        <p class="text-gray-400 font-medium">Official Certificate Verification Portal</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            
            <!-- Search Box -->
            <div id="search-section" class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 text-center mb-8">
                <h2 class="text-2xl font-bold text-brand-navy mb-4">Verify a Certificate</h2>
                <p class="text-gray-500 mb-8">Enter the unique certificate ID below to verify authenticity and attendance records.</p>
                
                <form id="verify-form" class="flex flex-col sm:flex-row gap-4 justify-center">
                    <input type="text" id="cert-id-input" placeholder="e.g. PXT-2026-000001" class="px-6 py-4 rounded-xl border-2 border-gray-200 focus:border-brand-magenta focus:outline-none text-lg font-semibold w-full sm:w-2/3 uppercase transition-colors">
                    <button type="submit" class="bg-brand-navy text-white px-8 py-4 rounded-xl font-bold hover:bg-brand-magenta transition-colors w-full sm:w-1/3">
                        VERIFY
                    </button>
                </form>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="hidden text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-brand-magenta border-t-transparent"></div>
                <p class="mt-4 text-gray-500 font-semibold">Verifying record...</p>
            </div>

            <!-- Result Card -->
            <div id="result-section" class="hidden">
                <!-- Injected via JS -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white py-6 text-center text-gray-500 text-sm border-t border-gray-200">
        &copy; 2026 Praise Dynasty Real Estate × SmartKode Solutions. All rights reserved.
    </footer>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJBGi_WKLDU493eOrH4Emx7xx_li7wzoY",
            authDomain: "praise-dynasty-hni.firebaseapp.com",
            projectId: "praise-dynasty-hni",
            storageBucket: "praise-dynasty-hni.firebasestorage.app",
            messagingSenderId: "702909860929",
            appId: "1:702909860929:web:7c9d2a3c899df3dbf0cac0"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('verify-form');
        const input = document.getElementById('cert-id-input');
        const searchSection = document.getElementById('search-section');
        const loadingState = document.getElementById('loading-state');
        const resultSection = document.getElementById('result-section');

        // Check URL for ID
        const urlParams = new URLSearchParams(window.location.search);
        const urlId = urlParams.get('id');
        
        if (urlId) {
            input.value = urlId;
            verifyCertificate(urlId);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = input.value.trim().toUpperCase();
            if (id) verifyCertificate(id);
        });

        async function verifyCertificate(certId) {
            resultSection.innerHTML = '';
            resultSection.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                const certRef = ref(db, `articles/certificates/${certId}`);
                const snapshot = await get(certRef);

                loadingState.classList.add('hidden');
                resultSection.classList.remove('hidden');

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    if (data.verification_status === 'REVOKED') {
                        showRevoked(certId);
                    } else {
                        showValid(data);
                    }
                } else {
                    showInvalid(certId);
                }
            } catch (error) {
                loadingState.classList.add('hidden');
                resultSection.classList.remove('hidden');
                resultSection.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-2xl text-center border border-red-200">An error occurred while verifying. Please try again.</div>`;
            }
        }

        function showValid(data) {
            resultSection.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100 transform transition-all">
                    <div class="bg-green-500 text-white p-6 text-center">
                        <div class="text-4xl mb-2">✅</div>
                        <h3 class="text-2xl font-bold tracking-wider">CERTIFICATE VERIFIED</h3>
                    </div>
                    
                    <div class="p-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Participant</p>
                                <p class="text-2xl font-bold text-brand-navy">${data.participant_name}</p>
                            </div>
                            
                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Certificate ID</p>
                                <p class="text-xl font-mono text-gray-800 bg-gray-100 px-3 py-1 rounded inline-block">${data.certificate_id}</p>
                            </div>

                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Event</p>
                                <p class="text-lg font-semibold text-gray-800">PROPERTY × TECH 2026</p>
                            </div>

                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Format</p>
                                <p class="text-lg font-semibold text-gray-800">Virtual Summit — Google Meet</p>
                            </div>

                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Date</p>
                                <p class="text-lg font-semibold text-gray-800">September 12, 2026</p>
                            </div>
                            
                            <div>
                                <p class="text-sm text-gray-500 font-semibold mb-1 uppercase tracking-wider">Status</p>
                                <p class="text-lg font-bold text-green-500">VALID</p>
                            </div>
                        </div>

                        <div class="mt-8 pt-8 border-t border-gray-100">
                            <p class="text-sm text-gray-500 font-semibold mb-2 uppercase tracking-wider">Issued By</p>
                            <p class="font-bold text-brand-navy">Praise Dynasty Real Estate <span class="text-gray-400">×</span> SmartKode Solutions</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function showInvalid(id) {
            resultSection.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 text-center">
                    <div class="bg-yellow-500 text-white p-6">
                        <div class="text-4xl mb-2">⚠️</div>
                        <h3 class="text-2xl font-bold tracking-wider">CERTIFICATE NOT FOUND</h3>
                    </div>
                    <div class="p-8">
                        <p class="text-lg text-gray-600 mb-4">We could not find any record for Certificate ID:</p>
                        <p class="text-xl font-mono font-bold text-gray-900 bg-gray-100 px-4 py-2 rounded inline-block mb-6">${id}</p>
                        <p class="text-gray-500">Please check the ID and try again, or contact the organizers if you believe this is an error.</p>
                    </div>
                </div>
            `;
        }

        function showRevoked(id) {
            resultSection.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 text-center">
                    <div class="bg-red-600 text-white p-6">
                        <div class="text-4xl mb-2">❌</div>
                        <h3 class="text-2xl font-bold tracking-wider">CERTIFICATE REVOKED</h3>
                    </div>
                    <div class="p-8">
                        <p class="text-lg text-gray-600 mb-4">The certificate associated with ID:</p>
                        <p class="text-xl font-mono font-bold text-gray-900 bg-gray-100 px-4 py-2 rounded inline-block mb-6">${id}</p>
                        <p class="text-red-600 font-bold">Has been officially revoked by the organizers and is no longer valid.</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
